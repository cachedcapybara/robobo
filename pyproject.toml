[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robobo"
version = "0.2.0"
description = "A small Telegram bot for Debian package lookups"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot[rate-limiter]==22.8",
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "asyncpg==0.32.0",
    "python-dotenv==1.2.4",
]

[tool.setuptools]
packages = ["robobo", "robobo.handlers", "robobo.services"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
