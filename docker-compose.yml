services:
  robobo:
    build: .
    env_file:
      - .env
    restart: unless-stopped
    init: true
    # 安全公告的已见记录持久化在这里，重启/重建容器不会丢
    volumes:
      - robobo-state:/app/state
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  robobo-state:
